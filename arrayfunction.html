<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Functions</title>
</head>
<body>
    <script>
        let arr=[10,20,30,40,50];
        document.write(arr+"<br>");
        document.write(arr.length+"<br>");
        document.write(arr[2]+"<br>");
        arr.push(60);
        document.write(arr+"<br>");
        arr.pop();
        document.write(arr+"<br>");
        arr.shift();
        document.write(arr+"<br>");
        arr.unshift(5);
        document.write(arr+"<br>");        
    </script>
</body>
</html>
